# Publishes dist/ to GitHub Pages. Run by hand from the Actions tab
# (Actions → Pages → Run workflow).
#
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
# Pages is free on public repositories; a private repository needs GitHub Pro
# or a Team/Enterprise plan. The run fails until Pages is switched on.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
